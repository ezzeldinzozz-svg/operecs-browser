<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operecs Browser</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="browser-app">
    <!-- LEFT COLUMN: VERTICAL SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <!-- Sidebar Header & Brand -->
      <div class="sidebar-header">
        <div class="brand-badge">
          <svg viewBox="0 0 64 64" width="26" height="26" style="border-radius:6px;flex-shrink:0;">
            <rect width="64" height="64" rx="16" fill="#0b0910"/>
            <path d="M32 12c12 0 21 8.5 21 20s-9 20-21 20S11 43.5 11 32s9-20 21-20Zm0 9c-6.8 0-11.5 4.5-11.5 11S25.2 43 32 43s11.5-4.5 11.5-11S38.8 21 32 21Z" fill="#6d28d9"/>
            <circle cx="47" cy="17" r="5" fill="#c7adff"/>
          </svg>
          <span class="brand-title">Operecs</span>
        </div>
        <button class="sidebar-toggle-btn" id="btn-toggle-sidebar" title="Toggle Sidebar (Ctrl+S)">
          <svg id="sidebar-collapse-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
      </div>

      <!-- Pinned Web Apps Shelf -->
      <div class="pinned-shelf">
        <button class="pinned-item" data-url="https://www.google.com" title="Google">
          <img src="https://www.google.com/favicon.ico" alt="Google" onerror="this.style.display='none'">
        </button>
        <button class="pinned-item" data-url="https://www.youtube.com" title="YouTube">
          <img src="https://www.youtube.com/favicon.ico" alt="YouTube" onerror="this.style.display='none'">
        </button>
        <button class="pinned-item" data-url="https://github.com" title="GitHub">
          <img src="https://github.githubassets.com/favicons/favicon.png" alt="GitHub" onerror="this.style.display='none'">
        </button>
        <button class="pinned-item" data-url="https://chatgpt.com" title="ChatGPT">
          <img src="https://chatgpt.com/favicon.ico" alt="ChatGPT" onerror="this.style.display='none'">
        </button>
      </div>

      <!-- Vertical Tabs Section Header -->
      <div class="sidebar-section-head">
        <span class="section-label">OPEN TABS</span>
        <button class="sidebar-add-tab-btn" id="btn-new-tab" title="New Tab (Ctrl+T)">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>

      <!-- Scrollable Vertical Tabs List -->
      <div class="vertical-tab-strip" id="tab-strip">
        <!-- Tabs dynamically rendered here -->
      </div>

      <!-- Sidebar Footer Quick Actions -->
      <div class="sidebar-footer">
        <button class="sidebar-footer-btn" id="btn-history-toggle" title="Browsing History">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span class="footer-btn-label">History</span>
        </button>
        <button class="sidebar-footer-btn" id="btn-devtools" title="Developer Tools (F12)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
          <span class="footer-btn-label">Inspect</span>
        </button>
      </div>
    </aside>

    <!-- RIGHT STAGE: TOP TOOLBAR & SPLIT STAGE -->
    <div class="main-stage">
      <!-- Top Omnibox Navigation Bar -->
      <header class="top-nav-bar">
        <!-- Navigation Controls -->
        <div class="nav-controls">
          <button class="nav-btn" id="btn-back" title="Back (Alt+Left)" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <button class="nav-btn" id="btn-forward" title="Forward (Alt+Right)" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
          <button class="nav-btn" id="btn-reload" title="Reload (Ctrl+R)">
            <svg id="reload-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l6.73-5.19"></path>
            </svg>
            <svg id="stop-icon" class="hidden" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
          <button class="nav-btn" id="btn-home" title="Home">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </button>
        </div>

        <!-- Omnibox (Search & Address Bar) -->
        <div class="omnibox-wrapper">
          <div class="omnibox-icon" id="security-badge">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <input type="text" id="omnibox-input" class="omnibox-input" placeholder="Search Google or enter address..." spellcheck="false" autocomplete="off" />
          <button class="star-btn" id="btn-bookmark" title="Bookmark this tab">
            <svg id="star-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
          </button>
        </div>

        <!-- Split View Controls -->
        <div class="split-controls">
          <button class="split-btn" id="btn-split-toggle" title="Toggle Split View (Alt+S)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="12" y1="3" x2="12" y2="21"></line>
            </svg>
            <span class="split-label">Split</span>
          </button>

          <!-- Split pane indicators (visible in split mode) -->
          <div class="split-pane-badges hidden" id="split-pane-badges">
            <button class="pane-badge active" id="badge-pane-left">Left</button>
            <button class="pane-badge" id="badge-pane-right">Right</button>
          </div>
        </div>

        <!-- Window Drag Spacer -->
        <div class="drag-region"></div>

        <!-- Windows Controls -->
        <div class="window-controls">
          <button class="window-btn minimize-btn" id="btn-minimize" title="Minimize">
            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2">
              <line x1="4" y1="12" x2="20" y2="12"></line>
            </svg>
          </button>
          <button class="window-btn maximize-btn" id="btn-maximize" title="Maximize">
            <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="4" y="4" width="16" height="16" rx="1"></rect>
            </svg>
          </button>
          <button class="window-btn close-btn" id="btn-close" title="Close">
            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2">
              <line x1="5" y1="5" x2="19" y2="19"></line>
              <line x1="19" y1="5" x2="5" y2="19"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- Split Divider Line (rendered centrally in split mode) -->
      <div class="split-divider hidden" id="split-divider"></div>
    </div>
  </div>

  <!-- History Dropdown Modal -->
  <div class="history-dropdown hidden" id="history-dropdown">
    <div class="history-header">
      <span>Browsing History</span>
      <button class="clear-history-btn" id="btn-clear-history">Clear</button>
    </div>
    <div class="history-list" id="history-list">
      <!-- History items inserted dynamically -->
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
